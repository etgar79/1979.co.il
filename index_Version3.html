    <style>
        body {
            font-family: 'Heebo', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: linear-gradient(to bottom, #1c1c1c, #2e2e2e);
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 3rem;
            margin: 0;
            color: #00aaff;
        }

            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.2s;
        }

        .download-btn:hover {
            background-color: #0077b3;
            transform: scale(1.05);
        }

        .help-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #f05454;
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            transition: background-color 0.3s, transform 0.2s;
        }

        .help-btn:hover {
            background-color: #d94343;
            transform: scale(1.1);
        }

        footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.9rem;
            color: #a0a0a0;
        }
    </style>
</head>
